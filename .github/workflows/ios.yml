# UO Mobile: build the iPhone app on a GitHub macOS runner.
# Output: an unsigned .ipa artifact; install it from Windows with Sideloadly (your Apple ID signs it).
name: iOS

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch: {}

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # Microsoft.iOS.Sdk 26.5.x requires Xcode 26.6, but on the image 26.6 once could not find
      # clang++ for the final link. Run its first-launch setup and probe the linker lookup the
      # .NET targets use; if it still fails, use 26.5 and skip .NET's Xcode version check.
      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          pick() { sudo xcode-select -s "$1/Contents/Developer"; sudo xcodebuild -runFirstLaunch >/dev/null 2>&1 || true; }
          probe() { xcrun --sdk iphoneos --find clang++ && xcodebuild -sdk "$(xcrun --sdk macosx --show-sdk-path)" -find clang++; }
          XC="$(ls -d /Applications/Xcode_26.6*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$XC" ] && pick "$XC" && probe; then
            echo "Using $XC"
          else
            XC="$(ls -d /Applications/Xcode_26.5*.app | sort -V | tail -1)"
            pick "$XC"; probe
            echo "Using $XC with ValidateXcodeVersion=false"
            echo "EXTRA_PROPS=-p:ValidateXcodeVersion=false" >> "$GITHUB_ENV"
          fi
          xcodebuild -version

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: .NET iOS workload
        run: |
          dotnet workload install ios
          dotnet workload list

      - name: Tools
        run: brew install ninja || true

      - name: Restore native libs (SDL3, FNA3D, FAudio, Theorafile)
        id: libcache
        uses: actions/cache/restore@v4
        with:
          path: ios/native
          key: fnalibs-${{ runner.os }}-${{ hashFiles('.gitmodules') }}-${{ hashFiles('external/FNA/lib/**/CMakeLists.txt') }}

      - name: Build native libs
        if: steps.libcache.outputs.cache-hit != 'true'
        run: bash ios/build-ios.sh libs

      # Saved right away, so a failure in the app build doesn't throw the 20-minute lib build away.
      - name: Save native libs
        if: steps.libcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ios/native
          key: ${{ steps.libcache.outputs.cache-primary-key }}

      - name: Build app (unsigned)
        env:
          UNSIGNED: '1'
          BUNDLE_ID: com.mapraustin.uomobile
        run: bash ios/build-ios.sh build

      - uses: actions/upload-artifact@v4
        with:
          name: UOMobile-ipa
          path: ios/out/UOMobile-unsigned.ipa
          if-no-files-found: error
