# UO Mobile: build the iPhone app on a GitHub macOS runner.
# Output: an unsigned .ipa artifact; install it from Windows with Sideloadly (your Apple ID signs it).
name: iOS

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch: {}

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      HAVE_SIGNING: ${{ secrets.DIST_P12_BASE64 != '' }}
      APP_BUNDLE_ID: com.mapraustin.britgraveyard
      PROFILE_NAME: Brit Graveyard Battles AppStore
      PROFILE_UUID: e79c8018-f5ba-4946-8940-7589df040163
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # Microsoft.iOS.Sdk 26.5.x asks for Xcode 26.6, but on this image 26.6's clang++ lookup
      # fails inside the .NET link step (xcrun ... -find clang++ exit 16384) even though it works
      # from the shell. 26.5 links fine, so use it and skip .NET's exact-version check.
      # ios/AUDIT.md: static checks for every failure that already cost a TestFlight round trip.
      - name: iOS preflight
        run: bash ios/preflight.sh

      - name: Select Xcode 26.5
        run: |
          ls -d /Applications/Xcode*.app
          XC="$(ls -d /Applications/Xcode_26.5*.app | sort -V | tail -1)"
          # Xcode_26.5.0.app is a symlink to Xcode_26.5.app; the .NET link step's xcrun lookup
          # failed through the symlinked path, so use the real directory everywhere.
          XC="$(cd "$XC" && pwd -P)"
          echo "Using $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          sudo xcodebuild -runFirstLaunch >/dev/null 2>&1 || true
          sudo xcrun --kill-cache || true
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          echo "MD_APPLE_SDK_ROOT=$XC" >> "$GITHUB_ENV"
          echo "EXTRA_PROPS=-p:ValidateXcodeVersion=false" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun --sdk iphoneos --find clang++

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: .NET iOS workload
        run: |
          # Pinned: workload set 10.0.401.1 (2026-09-30) moved the iOS SDK to 27.0, which needs an
          # Xcode 27 this image doesn't have (build 38 failed with MT4162). 10.0.401 = iOS SDK 26.5.10318.
          dotnet workload install ios --version 10.0.401
          dotnet workload list

      - name: Tools
        run: brew install ninja || true

      - name: Restore native libs (SDL3, FNA3D, FAudio, Theorafile)
        id: libcache
        uses: actions/cache/restore@v4
        with:
          path: ios/native
          key: fnalibs-${{ runner.os }}-${{ hashFiles('.gitmodules', 'ios/build-ios.sh') }}-${{ hashFiles('external/FNA/lib/**/CMakeLists.txt') }}

      - name: Build native libs
        if: steps.libcache.outputs.cache-hit != 'true'
        run: bash ios/build-ios.sh libs

      # Saved right away, so a failure in the app build doesn't throw the 20-minute lib build away.
      - name: Save native libs
        if: steps.libcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ios/native
          key: ${{ steps.libcache.outputs.cache-primary-key }}

      # --- Signed App Store build + TestFlight upload (needs the repo secrets set by
      #     ios/set-github-secrets.sh). Without them the unsigned build below still runs.
      - name: Install signing certificate and profile
        if: env.HAVE_SIGNING == 'true'
        env:
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.PROFILE_BASE64 }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"; KCPW="$(uuidgen)"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          echo "$DIST_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "$DIST_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"; echo "$PROFILE_BASE64" | base64 --decode > "$d/$PROFILE_UUID.mobileprovision"
          done
          rm -f "$RUNNER_TEMP/dist.p12"

      - name: Build app (App Store signed)
        if: env.HAVE_SIGNING == 'true'
        env:
          BUNDLE_ID: ${{ env.APP_BUNDLE_ID }}
          CODESIGN_KEY: Apple Distribution
          PROVISION: ${{ env.PROFILE_NAME }}
        run: |
          export EXTRA_PROPS="$EXTRA_PROPS -p:ApplicationVersion=${{ github.run_number }} -p:BuildIpa=true"
          bash ios/build-ios.sh build
          IPA="$(find ios/bin -path '*publish*' -name '*.ipa' | head -1)"
          [ -n "$IPA" ] || { echo "no signed .ipa produced"; exit 1; }
          mkdir -p ios/out && cp "$IPA" ios/out/GraveyardBattles.ipa
          ls -la ios/out

      - name: Upload to TestFlight
        if: env.HAVE_SIGNING == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          xcrun altool --upload-app --type ios --file ios/out/GraveyardBattles.ipa --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" --output-format normal

      - uses: actions/upload-artifact@v4
        if: env.HAVE_SIGNING == 'true'
        with:
          name: GraveyardBattles-appstore-ipa
          path: ios/out/GraveyardBattles.ipa

      - name: Build app (unsigned)
        if: env.HAVE_SIGNING != 'true'
        env:
          UNSIGNED: '1'
          BUNDLE_ID: ${{ env.APP_BUNDLE_ID }}
        run: bash ios/build-ios.sh build

      - uses: actions/upload-artifact@v4
        if: env.HAVE_SIGNING != 'true'
        with:
          name: UOMobile-ipa
          path: ios/out/UOMobile-unsigned.ipa
          if-no-files-found: error
