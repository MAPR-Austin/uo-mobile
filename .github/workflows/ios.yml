# UO Mobile: build the iPhone app on a GitHub macOS runner.
# Output: an unsigned .ipa artifact; install it from Windows with Sideloadly (your Apple ID signs it).
name: iOS

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch: {}

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # The .NET iOS workload (Microsoft.iOS.Sdk 26.5) is built against Xcode 26.5; the newest
      # Xcode on the image (26.6) failed to provide clang++ for the final link.
      - name: Select Xcode 26.5
        run: |
          ls -d /Applications/Xcode*.app
          XC="$(ls -d /Applications/Xcode_26.5*.app 2>/dev/null | sort -V | tail -1)"
          [ -n "$XC" ] || XC="$(xcode-select -p | sed 's|/Contents/Developer||')"
          echo "Using $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --find clang++

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: .NET iOS workload
        run: |
          dotnet workload install ios
          dotnet workload list

      - name: Tools
        run: brew install ninja || true

      - name: Restore native libs (SDL3, FNA3D, FAudio, Theorafile)
        id: libcache
        uses: actions/cache/restore@v4
        with:
          path: ios/native
          key: fnalibs-${{ runner.os }}-${{ hashFiles('.gitmodules') }}-${{ hashFiles('external/FNA/lib/**/CMakeLists.txt') }}

      - name: Build native libs
        if: steps.libcache.outputs.cache-hit != 'true'
        run: bash ios/build-ios.sh libs

      # Saved right away, so a failure in the app build doesn't throw the 20-minute lib build away.
      - name: Save native libs
        if: steps.libcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ios/native
          key: ${{ steps.libcache.outputs.cache-primary-key }}

      - name: Build app (unsigned)
        env:
          UNSIGNED: '1'
          BUNDLE_ID: com.mapraustin.uomobile
        run: bash ios/build-ios.sh build

      - uses: actions/upload-artifact@v4
        with:
          name: UOMobile-ipa
          path: ios/out/UOMobile-unsigned.ipa
          if-no-files-found: error
