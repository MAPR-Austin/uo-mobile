# UO Mobile: build the iPhone app on a GitHub macOS runner.
# Output: an unsigned .ipa artifact; install it from Windows with Sideloadly (your Apple ID signs it).
name: iOS

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch: {}

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Select newest Xcode
        run: |
          XC="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          echo "Using $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: .NET iOS workload
        run: |
          dotnet workload install ios
          dotnet workload list

      - name: Tools
        run: brew install ninja || true

      - name: Cache native libs (SDL3, FNA3D, FAudio, Theorafile)
        id: libcache
        uses: actions/cache@v4
        with:
          path: ios/native
          key: fnalibs-${{ runner.os }}-${{ hashFiles('.gitmodules', 'ios/build-ios.sh') }}-${{ hashFiles('external/FNA/lib/**/CMakeLists.txt') }}

      - name: Build native libs
        if: steps.libcache.outputs.cache-hit != 'true'
        run: bash ios/build-ios.sh libs

      - name: Build app (unsigned)
        env:
          UNSIGNED: '1'
          BUNDLE_ID: com.mapraustin.uomobile
        run: bash ios/build-ios.sh build

      - uses: actions/upload-artifact@v4
        with:
          name: UOMobile-ipa
          path: ios/out/UOMobile-unsigned.ipa
          if-no-files-found: error
