# UO Mobile on Android, built and tested on GitHub's machines. Builds the native libs (cached),
# the phase-0 hello APK (android/hello) and the game (android/app), both Release and signed with
# the SDK's debug key, then runs them in an x86_64 emulator: hello with the GLES and Vulkan
# drivers, the game up to its download screen. Keeps logcat, logs and screenshots.
# Runs on the "android" branch only, so Android work never starts an iPhone build.
name: Android

on:
  push:
    branches: [android]
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      live:
        description: 'Also download the game files and log in on the LIVE server as ciandroid (~2.1 GB from the VM)'
        type: boolean
        default: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  SDL_TAG: release-3.2.x

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: JDK 21, Android workload
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          dotnet workload install android --version 10.0.401
          dotnet workload list
          echo "ANDROID_HOME=$ANDROID_HOME  NDK=$ANDROID_NDK_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Restore native libs (SDL3, FNA3D, FAudio) and SDL's Java glue
        id: libcache
        uses: actions/cache/restore@v4
        with:
          path: |
            android/native
            android/sdl-java
          key: fnalibs-android-${{ env.SDL_TAG }}-${{ hashFiles('.gitmodules', 'android/build-android-libs.sh') }}-${{ hashFiles('external/FNA/lib/**/CMakeLists.txt') }}

      - name: Build native libs
        if: steps.libcache.outputs.cache-hit != 'true'
        run: bash android/build-android-libs.sh

      - name: Save native libs
        if: steps.libcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            android/native
            android/sdl-java
          key: ${{ steps.libcache.outputs.cache-primary-key }}

      - name: Build hello APK
        run: |
          dotnet build android/hello/UOMobile.AndroidHello.csproj -c Release \
            -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" \
            -p:ApplicationVersion=${{ github.run_number }}
          APK="$(find android/hello/bin/Release -name '*-Signed.apk' | head -1)"
          [ -n "$APK" ] || { echo "no signed APK"; find android/hello/bin -name '*.apk'; exit 1; }
          mkdir -p android/out && cp "$APK" android/out/UOMobileHello.apk
          ls -la android/out
          unzip -l android/out/UOMobileHello.apk | grep -E '\.so$' || true
          ZA="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/zipalign"
          "$ZA" -c -P 16 -v 4 android/out/UOMobileHello.apk | tail -3 || echo "(not 16 KB aligned - fine for a test APK, fix before Play)"

      - name: Build the game APK
        run: |
          dotnet build android/app/ClassicUO.Android.csproj -c Release             -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME"             -p:ApplicationVersion=${{ github.run_number }}
          APK="$(find android/app/bin/Release -name '*-Signed.apk' | head -1)"
          [ -n "$APK" ] || { echo "no signed APK"; find android/app/bin -name '*.apk'; exit 1; }
          cp "$APK" android/out/GraveyardBattles.apk
          ls -la android/out

      # Re-signed with the release key (repo secrets ANDROID_KEYSTORE_B64 / _PASS; the original is
      # in the owner's secrets folder) by apksigner directly, so its errors show (MSBuild's signing
      # only said "java exited with code 2"). Without the secrets the SDK debug key stays.
      - name: Sign with the release key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KP: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          [ -n "$KS" ] || { echo "no release key: the APK keeps the debug signature"; exit 0; }
          echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.p12"
          printf %s "$KP" > "$RUNNER_TEMP/kp"
          keytool -list -keystore "$RUNNER_TEMP/upload.p12" -storetype PKCS12 -storepass:file "$RUNNER_TEMP/kp" | grep -iE "entry|alias|keystore type" || true
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          set +e
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/upload.p12" --ks-type PKCS12 --ks-key-alias uomobile             --ks-pass "file:$RUNNER_TEMP/kp" --key-pass "file:$RUNNER_TEMP/kp"             --out android/out/GraveyardBattles-release.apk android/out/GraveyardBattles.apk
          rc=$?
          set -e
          rm -f "$RUNNER_TEMP/upload.p12" "$RUNNER_TEMP/kp"
          [ $rc = 0 ] || exit $rc
          mv android/out/GraveyardBattles-release.apk android/out/GraveyardBattles.apk
          "$BT/apksigner" verify --print-certs android/out/GraveyardBattles.apk | grep -E "Signer #1 certificate DN|SHA-256" | head -2

      - uses: actions/upload-artifact@v4
        with:
          name: UOMobileHello-apk
          path: android/out/UOMobileHello.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: GraveyardBattles-apk
          path: android/out/GraveyardBattles.apk
          if-no-files-found: error

  smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: UOMobileHello-apk
          path: android/out

      - uses: actions/download-artifact@v4
        with:
          name: GraveyardBattles-apk
          path: android/out

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run in the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          disable-animations: true
          script: bash android/smoke.sh android/out/UOMobileHello.apk && bash android/app-smoke.sh android/out/GraveyardBattles.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-logcat-and-screens
          path: android/smoke-out

  # By hand only (Run workflow > live): the whole path on the live server - download, login,
  # walking, rotation - as the throwaway account ciandroid (owner-approved, a few runs).
  live:
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.live }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: GraveyardBattles-apk
          path: android/out

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download, log in and walk in the emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          CI_PASSWORD: ${{ secrets.ANDROID_CI_PASSWORD }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disk-size: 8G
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          disable-animations: true
          script: bash android/live-test.sh android/out/GraveyardBattles.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-screens-and-logs
          path: android/live-out
